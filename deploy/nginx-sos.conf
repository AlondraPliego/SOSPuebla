# Nginx: sirve el frontend y reenvía la API y el WebSocket al backend (que sólo escucha en 127.0.0.1:8080).
# Certbot agrega el bloque HTTPS (443) automáticamente.
server {
    listen 80;
    server_name 100-53-188-210.sslip.io;

    root /var/www/sos;
    index index.html;

    # API: /api/alertas -> http://127.0.0.1:8080/alertas  (también acepta WebSocket en /api/ws)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # WebSocket de alertas en tiempo real (STOMP)
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # App y Centro de Mando (/panel): todas las rutas las resuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 5m;
}
